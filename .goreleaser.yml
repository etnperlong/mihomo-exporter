version: 2

project_name: mihomo-exporter

builds:
  - id: mihomo-exporter-linux
    main: ./cmd/mihomo-exporter
    binary: mihomo-exporter
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    tags:
      - netgo
      - osusergo
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - 386
      - arm
      - riscv64
      - mips
      - mipsle
    goarm:
      - 6,softfloat
      - 7,hardfloat
    gomips:
      - softfloat
      - hardfloat

  - id: mihomo-exporter-unix
    main: ./cmd/mihomo-exporter
    binary: mihomo-exporter
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    tags:
      - netgo
      - osusergo
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64

  - id: mihomo-exporter-windows
    main: ./cmd/mihomo-exporter
    binary: mihomo-exporter
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    tags:
      - netgo
      - osusergo
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - windows
    goarch:
      - amd64
      - arm64
      - 386

archives:
  - id: default
    ids:
      - mihomo-exporter-linux
      - mihomo-exporter-unix
      - mihomo-exporter-windows
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}"
    files:
      - LICENSE*

checksum:
  name_template: checksums.txt

dockers_v2:
  - id: ghcr
    ids:
      - mihomo-exporter-linux
    dockerfile: Dockerfile
    images:
      - "{{ .Env.IMAGE }}"
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - --target=release
